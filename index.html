<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --side:#16245C;
  --navy:#1E2C6E;
  --blue:#2F3C9E;
  --gold:#F6C20F;
  --gold-soft:#FFF5CF;
  --red:#E01B22;
  --red-dark:#B8121A;
  --bg:#E8EBF2;
  --card:#FFFFFF;
  --ink:#101A40;
  --muted:#5A6382;
  --line:#DCE1EC;
  --ok:#17845A; --ok-soft:#E3F5EC;
  --bad:#C2303B; --bad-soft:#FCE8EA;
  --head:'Montserrat', 'Segoe UI', system-ui, sans-serif;
  --body:'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --shadow:0 1px 2px rgba(16,26,64,.06), 0 6px 18px -8px rgba(16,26,64,.22);
  --sidew:284px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--head);line-height:1.15;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none !important}

/* ── Shell: sidebar + content ─────────────────────────── */
.side{position:fixed;inset:0 auto 0 0;width:var(--sidew);background:var(--side);color:#fff;display:flex;flex-direction:column;z-index:40}
.brand{display:flex;align-items:center;gap:14px;padding:26px 22px 30px}
.brand .disc{width:84px;height:84px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:0 0 auto;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.brand .disc img{width:58px;height:66px;object-fit:contain}
.brand b{display:block;font-family:var(--head);font-weight:800;font-size:25px;color:var(--gold);line-height:1;letter-spacing:.02em}
.brand span{display:block;font-family:var(--head);font-weight:800;font-size:17px;line-height:1.1;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:13px;width:100%;border:0;background:none;color:#fff;text-align:left;padding:15px 22px;font-size:16px;font-weight:400;border-right:5px solid transparent;transition:background .15s}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button svg{width:24px;height:24px;color:var(--gold);flex:0 0 auto}
.nav button .lk{width:14px;height:14px;margin-left:auto;color:#8F99C7}
.nav button[aria-current="page"]{background:var(--gold);color:var(--ink);font-weight:700;border-right-color:var(--red)}
.nav button[aria-current="page"] svg{color:var(--ink)}
.side-foot{margin-top:auto;padding:20px 22px 24px;border-top:1px solid rgba(255,255,255,.1)}
.side-foot .turn{display:flex;align-items:center;gap:12px;font-size:14px;color:#C5CCEA}
.side-foot .turn b{display:block;color:#fff;font-family:var(--head);font-size:20px}
.side-foot svg.ring{width:48px;height:48px;transform:rotate(-90deg);flex:0 0 auto}
.side-foot circle{fill:none;stroke-width:5}
.lockbtn{margin-top:14px;width:100%;border:1px solid rgba(255,255,255,.3);background:none;color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700}

.content{margin-left:var(--sidew);min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;background:#fff;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 16px;padding:14px 32px;min-height:88px;box-shadow:0 2px 10px rgba(16,26,64,.08)}
.topbar h1{font-weight:800;font-size:clamp(18px,1.75vw,30px);color:var(--ink);letter-spacing:.01em;white-space:nowrap}
.who{display:flex;align-items:center;gap:14px;font-size:17px;white-space:nowrap}
.top-right{display:flex;align-items:center;gap:22px}
.lang{display:flex;background:#EEF1F8;border-radius:99px;padding:4px;gap:2px}
.lang button{border:0;background:none;border-radius:99px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--muted)}
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--side);color:#fff}
.who b{font-weight:700}
.avatar{width:54px;height:54px;border-radius:50%;overflow:hidden;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:19px;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--gold);flex:0 0 auto}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:top}
.avatar.off{background:#C9CFDF;color:var(--side);box-shadow:none}
main{padding:28px 32px 120px;max-width:1320px}

/* ── Buttons & inputs ─────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:13px 22px;font-weight:700;font-size:16px;background:var(--navy);color:#fff;transition:transform .12s, filter .15s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.red{background:var(--red);font-family:var(--head);font-weight:800;letter-spacing:.02em;box-shadow:0 0 0 3px var(--gold), 0 4px 14px rgba(224,27,34,.35)}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--navy);filter:none}
.btn.danger{background:var(--bad)}
.btn.sm{padding:8px 14px;font-size:14px}
.btn.lg{padding:16px 28px;font-size:17px}
.btn.block{width:100%}
.field{width:100%;border:2px solid var(--line);border-radius:10px;padding:11px 14px;background:#fff;outline:none}
.field:focus{border-color:var(--navy)}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow)}
.sec-title{font-family:var(--head);font-weight:800;font-size:clamp(19px,2vw,24px);text-transform:uppercase;letter-spacing:.01em;margin:28px 0 6px}
.sec-sub{color:var(--muted);margin:0 0 16px}

/* ── Vote layout ─────────────────────────── */
.vote{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:28px;align-items:start}
.status{position:sticky;top:112px;display:flex;flex-direction:column;gap:18px}
.status > h2{font-weight:800;font-size:26px;margin-bottom:-2px}
.status .card{padding:20px}
.status h3{font-size:19px;font-weight:800;margin-bottom:14px}

/* Hero banner */
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:30px;padding:26px 36px;min-height:190px}
.hero img{width:124px;height:142px;object-fit:contain;flex:0 0 auto;position:relative;z-index:1}
.hero h2{position:relative;z-index:1;font-weight:800;font-size:clamp(24px,2.5vw,38px);line-height:1.12;color:var(--ink);max-width:16em}
.hero p{position:relative;z-index:1;margin:8px 0 0;color:var(--muted);font-size:17px;max-width:40ch}
.hero .txt{position:relative;z-index:1;margin-right:min(25%,220px)}
.hero .deco{position:absolute;right:0;top:0;bottom:0;width:min(34%,300px);pointer-events:none}
.hero.slim{min-height:0;padding:18px 28px}
.hero.slim img{width:78px;height:90px}
.hero.slim h2{font-size:clamp(22px,2.6vw,30px)}

/* Alert bar */
.alert{display:flex;align-items:center;gap:12px;margin-top:18px;padding:14px 22px;border-radius:10px;background:var(--red);color:#fff;font-size:18px;box-shadow:0 4px 14px -4px rgba(224,27,34,.5)}
.alert svg{width:24px;height:24px;flex:0 0 auto}
.alert b{font-family:var(--head);font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.alert.closed{background:#5A6382;box-shadow:none}

/* Progress steps */
.steps{list-style:none;margin:0;padding:0;position:relative}
.steps:before{content:"";position:absolute;left:11px;top:22px;bottom:22px;width:3px;background:#C9CFDF;border-radius:2px}
.steps li{display:flex;align-items:center;gap:14px;position:relative}
.steps li + li{margin-top:12px}
.steps .dot{width:25px;height:25px;border-radius:50%;background:#C9CFDF;flex:0 0 auto;display:grid;place-items:center;color:#fff;box-shadow:0 0 0 4px #fff}
.steps .dot svg{width:14px;height:14px}
.steps .lbl{flex:1;border-radius:10px;padding:10px 14px;font-size:15px;line-height:1.3;background:#D5D9E4;color:#8A91AA;display:flex;justify-content:space-between;align-items:center;gap:8px}
.steps .lbl svg{width:18px;height:18px;flex:0 0 auto}
.steps li.done .dot{background:var(--side)}
.steps li.done .lbl{background:var(--side);color:#fff}
.steps li.now .dot{background:#fff;box-shadow:0 0 0 4px #fff, inset 0 0 0 3px var(--side)}
.steps li.now .dot:after{content:"";width:9px;height:9px;border-radius:50%;background:var(--side)}
.steps li.now .lbl{background:var(--navy);color:#fff}

/* Status cards */
.bignum{font-family:var(--head);font-weight:800;font-size:34px;line-height:1;color:#7A1020}
.bignum small{font-size:18px;color:var(--muted);font-weight:700}
.meter{height:8px;border-radius:99px;background:#E7EBF4;overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;background:var(--navy);border-radius:99px;transition:width .4s}
.chosen{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.chosen button{width:30px;height:30px;border-radius:50%;border:2px solid var(--gold);padding:0;overflow:hidden;background:var(--blue);position:relative}
.chosen button img,.chosen button .ini{width:100%;height:100%;object-fit:cover;object-position:top;font-size:12px}
.chosen button:hover:after{content:"×";position:absolute;inset:0;background:rgba(224,27,34,.85);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.chosen .empty-slot{width:30px;height:30px;border-radius:50%;border:2px dashed #C9CFDF}
.help a,.help button.link{display:block;color:var(--ink);text-decoration:underline;font-size:16px;margin:6px 0;background:none;border:0;padding:0;text-align:left}
.help ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px}
.help li + li{margin-top:4px}

/* Code entry */
.codecard{padding:30px 32px;margin-top:18px}
.codecard label{display:block;font-weight:700;font-size:18px;margin-bottom:14px}
.codebox{display:flex;gap:12px}
.codebox input{width:clamp(50px,9vw,68px);height:clamp(62px,11vw,80px);text-align:center;font-family:var(--head);font-size:clamp(28px,5vw,38px);font-weight:800;border:2px solid var(--line);border-radius:12px;background:#F4F6FB;text-transform:uppercase;outline:none;caret-color:var(--navy);transition:border-color .15s,background .15s}
.codebox input:focus{border-color:var(--navy);background:#fff}
.codebox input.filled{background:#fff;border-color:#AEB8DA}
.codebox.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.coderow{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.msg{margin-top:16px;padding:12px 14px;border-radius:10px;font-weight:700;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.info{background:#EAF0FF;color:var(--navy)}

/* Candidate filters & cards */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.search{position:relative;flex:1 1 220px;max-width:320px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search input{padding-left:40px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font-weight:700;font-size:14px;color:var(--muted)}
.chip:hover{border-color:#AEB8DA;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--side);border-color:var(--side);color:#fff}
.chip .n{font-weight:400;opacity:.75;margin-left:4px}
.group-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.group-h h4{font-size:19px;font-weight:800}
.group-h span{color:var(--muted);font-size:14px}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.cand{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:20px 16px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;transition:box-shadow .15s,transform .15s;position:relative}
.cand .ph{width:128px;height:128px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 35%,#9DB2D6,#5F76A8);display:grid;place-items:center}
.cand .ph img{width:100%;height:100%;object-fit:cover;object-position:top}
.ini{width:100%;height:100%;display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:38px;color:#fff}
.cand h4{font-size:19px;font-weight:700;margin-top:14px;line-height:1.2}
.cand .cl{color:var(--muted);font-size:15px;margin-top:4px}
.cand .btn{margin-top:16px;width:100%;font-size:14px;padding:12px 10px;text-transform:uppercase}
.cand.on{box-shadow:0 0 0 3px var(--gold), var(--shadow);transform:translateY(-2px)}
.cand.on .btn{background:var(--side);box-shadow:0 0 0 3px var(--gold)}
.cand .tick{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;transform:scale(0);transition:transform .22s cubic-bezier(.2,1.6,.4,1)}
.cand .tick svg{width:20px;height:20px}
.cand.on .tick{transform:scale(1)}
.cand.full:not(.on){opacity:.5}
.cands.small{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.cands.small .cand{padding:16px 12px}
.cands.small .ph{width:92px;height:92px}
.cands.small h4{font-size:16px}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.note{background:var(--gold-soft);border-radius:10px;padding:12px 16px;margin:0 0 16px;font-size:16px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}

/* Mobile bottom bar */
.mbar{display:none}

/* Done */
.thanks{padding:40px 30px 44px;text-align:center;margin-top:18px}
.thanks h2{font-weight:800;font-size:clamp(30px,4vw,44px);margin-top:22px;text-transform:uppercase}
.thanks p{font-size:18px;color:var(--muted);margin:10px auto 0;max-width:42ch}
.box{width:190px;height:170px;margin:0 auto;position:relative;overflow:hidden}
.box .paper{position:absolute;left:50%;top:0;width:96px;height:120px;margin-left:-48px;background:#fff;border-radius:8px;box-shadow:0 0 0 2px var(--line),0 6px 14px rgba(16,26,64,.15);animation:drop 1.1s .25s cubic-bezier(.6,0,.4,1) forwards;z-index:1}
.box .paper:before{content:"";position:absolute;left:14px;right:14px;top:22px;height:8px;border-radius:4px;background:var(--line);box-shadow:0 16px 0 var(--line),0 32px 0 var(--line)}
.box .paper:after{content:"";position:absolute;right:10px;bottom:12px;width:26px;height:26px;border-radius:50%;background:var(--red)}
.box .front{position:absolute;left:0;right:0;bottom:0;height:96px;background:var(--side);border-radius:10px 10px 14px 14px;z-index:2;display:grid;place-items:center;overflow:hidden}
.box .front:before{content:"";position:absolute;top:0;left:0;right:0;height:10px;background:repeating-conic-gradient(var(--gold) 0 25%, var(--blue) 0 50%) 0 0/10px 10px}
.box .slotline{position:absolute;left:40px;right:40px;bottom:94px;height:8px;border-radius:4px;background:var(--ink);z-index:3}
.box .tickmark{width:44px;height:44px;color:var(--gold);opacity:0;animation:pop .4s 1.3s forwards}
@keyframes drop{0%{transform:translateY(-10px)}100%{transform:translateY(110px)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}

/* ── Gate ─────────────────────────── */
.gate{max-width:440px;margin:6vh auto 0;padding:34px;text-align:center}
.gate img{width:80px;height:92px;object-fit:contain}
.gate h2{font-size:24px;font-weight:800;margin-top:14px;text-transform:uppercase}
.gate p{color:var(--muted);margin:8px 0 22px}
.gate .field{text-align:center;font-size:20px;letter-spacing:.1em}
.gate .btn{width:100%;margin-top:14px}

/* ── Results ─────────────────────────── */
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.sec-h h2{font-weight:800;font-size:clamp(24px,3vw,32px);text-transform:uppercase}
.sec-h p{margin:4px 0 0;color:var(--muted)}
.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:22px}
.stat{padding:18px 20px}
.stat .k{font-size:14px;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--head);font-size:32px;font-weight:800;line-height:1.1;margin-top:4px}
.stat .v small{font-size:17px;color:var(--muted);font-weight:700}
.stat.gold .meter i{background:var(--gold)}
.res-wrap{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px;align-items:start}
.board{padding:10px 0}
.row{display:grid;grid-template-columns:44px 48px minmax(0,1fr) minmax(90px,30%) 58px;gap:12px;align-items:center;padding:8px 18px}
.row + .row{border-top:1px solid #EEF1F8}
.row.lead{background:linear-gradient(90deg,var(--gold-soft),#fff 70%)}
.row .rk{font-family:var(--head);font-weight:800;font-size:19px;color:var(--navy);text-align:center}
.row .pic{width:48px;height:48px;border-radius:50%;overflow:hidden;background:#5F76A8}
.row .pic img{width:100%;height:100%;object-fit:cover;object-position:top}
.row .pic .ini{font-size:16px}
.row .who2 b{display:block;font-size:16px;line-height:1.2}
.row .who2 span{font-size:13px;color:var(--muted)}
.row .vb{height:10px;border-radius:99px;background:#EEF1F8;overflow:hidden;display:flex}
.row .vb i{display:block;height:100%;background:var(--navy)}
.row .vb i.s{background:var(--gold)}
.row .vt{font-family:var(--head);font-weight:800;font-size:21px;text-align:right}
.cut{display:flex;align-items:center;gap:12px;padding:12px 18px;color:var(--red);font-weight:700;font-size:14px}
.cut:before,.cut:after{content:"";flex:1;border-top:2px dashed currentColor;opacity:.5}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);padding:6px 18px 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--navy);margin-right:6px;vertical-align:-1px}
.legend i.s{background:var(--gold)}
.sidecard{padding:20px}
.sidecard + .sidecard{margin-top:16px}
.sidecard h3{font-size:18px;font-weight:800;margin-bottom:12px}
.crow{display:grid;grid-template-columns:52px 1fr 60px;gap:10px;align-items:center;font-size:14px;margin:9px 0}
.crow .meter{margin:0}
.crow span:last-child{text-align:right;color:var(--muted)}
.mix{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:6px 0 10px;background:#EEF1F8}
.mix i{display:block;height:100%}
.warn{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:12px 16px;font-weight:700;margin:0 18px 10px;font-size:15px}
.small-note{font-size:13px;color:var(--muted)}
.more{display:block;margin:6px auto 12px}

/* ── Roll ─────────────────────────── */
.rollbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.rollbar .field{width:auto}
.rollbar .search{flex:1 1 240px;max-width:360px}
table.roll{width:100%;border-collapse:collapse;font-size:15px}
.roll th{text-align:left;font-size:13px;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:2px solid var(--line);position:sticky;top:0;background:#fff}
.roll td{padding:10px 14px;border-bottom:1px solid #EEF1F8}
.roll tr:hover td{background:#F8FAFF}
.code{font-family:var(--head);font-weight:800;font-size:17px;letter-spacing:.12em}
.code.blur{filter:blur(6px);user-select:none}
.tag{display:inline-block;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:700}
.tag.yes{background:var(--ok-soft);color:var(--ok)}
.tag.no{background:#EEF1F8;color:var(--muted)}
.tag.staff{background:var(--gold-soft);color:#7A5B00}
.tablewrap{overflow:auto;max-height:68vh}
.linkbtn{border:0;background:none;color:var(--navy);font-weight:700;text-decoration:underline;padding:0;font-size:14px}

/* ── Admin & help ─────────────────────────── */
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.acard{padding:24px}
.acard h3{font-size:19px;font-weight:800}
.acard p{color:var(--muted);margin:6px 0 16px}
.switch{display:flex;align-items:center;gap:16px}
.switch b{font-family:var(--head);font-size:20px;font-weight:800}
.toggle{width:68px;height:38px;border-radius:99px;border:0;background:#C8CFE3;position:relative;transition:background .2s;flex:0 0 auto}
.toggle:after{content:"";position:absolute;top:4px;left:4px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .2s}
.toggle[aria-checked="true"]{background:var(--ok)}
.toggle[aria-checked="true"]:after{transform:translateX(30px)}
.inline .field{width:110px}
.acard.danger{box-shadow:inset 0 0 0 2px var(--bad-soft), var(--shadow)}
.helpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:18px}
.helpgrid .acard ol,.helpgrid .acard ul{margin:10px 0 0;padding-left:22px;font-size:17px}
.helpgrid .acard li + li{margin-top:8px}

/* ── Toast & loading ─────────────────────────── */
.toast{position:fixed;left:calc(50% + var(--sidew) / 2);bottom:36px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad)}
.loading{display:grid;place-items:center;padding:80px 0;color:var(--muted)}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--navy);animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Print: code slips ─────────────────────────── */
/* A4, 10 mm margins: 3 × 7 slips per page, each class starts on a new page.
   Cut lines are single dashed lines; nothing relies on background colours,
   so slips print correctly even with "Background graphics" switched off. */
#print-area{display:none}
@media print{
  @page{size:A4 portrait;margin:10mm}
  html,body{background:#fff !important}
  body > *:not(#print-area){display:none !important}
  #print-area{display:block}
  .sheet + .sheet{break-before:page}
  .slips{display:grid;grid-template-columns:repeat(3,63.3mm);grid-auto-rows:39.4mm;border-top:.25mm dashed #8A91AA;border-left:.25mm dashed #8A91AA;width:max-content}
  .ps{border-right:.25mm dashed #8A91AA;border-bottom:.25mm dashed #8A91AA;padding:3.2mm 4mm 2.8mm;display:flex;flex-direction:column;overflow:hidden;break-inside:avoid;color:#101A40;font-family:var(--body)}
  .ps-top{display:flex;align-items:center;gap:2.2mm;height:9mm}
  .ps-top img{width:7.8mm;height:9mm;object-fit:contain;flex:0 0 auto}
  .ps-top .org{flex:1;min-width:0;line-height:1.15}
  .ps-top .org b{display:block;font-family:var(--head);font-weight:800;font-size:6.2pt;letter-spacing:.01em;white-space:nowrap}
  .ps-top .org span{display:block;font-size:7pt;color:#5A6382;white-space:nowrap}
  .ps-top .cls{flex:0 0 auto;font-family:var(--head);font-weight:800;font-size:7pt;border:.25mm solid #101A40;border-radius:1.2mm;padding:.5mm 1.6mm;white-space:nowrap}
  .ps-name{margin-top:1.8mm;font-family:var(--head);font-weight:700;font-size:10.5pt;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ps-name.long{font-size:9pt}
  .ps-name.xlong{font-size:7.8pt}
  .ps-code{margin-top:1.6mm;height:10.5mm;border:.35mm solid #1E2C6E;border-radius:2mm;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:800;font-size:20pt;letter-spacing:.24em;padding-left:.24em;line-height:1}
  .ps-foot{margin-top:auto;font-size:6.6pt;color:#5A6382;text-align:center;white-space:nowrap}
  /* Teachers: one full page each */
  .sheet + .tpage, .tpage + .tpage{break-before:page}
  .tpage{display:flex;justify-content:center;padding-top:18mm}
  .tcard{width:150mm;border:.45mm solid #1E2C6E;border-radius:4mm;padding:14mm 14mm 12mm;text-align:center;color:#101A40;font-family:var(--body)}
  .tcard img{width:26mm;height:30mm;object-fit:contain}
  .t-school{font-family:var(--head);font-weight:800;font-size:17pt;margin-top:5mm;letter-spacing:.02em}
  .t-title{font-size:12.5pt;color:#5A6382;margin-top:1mm}
  .t-label{margin-top:11mm;font-size:11.5pt;color:#5A6382}
  .t-name{font-family:var(--head);font-weight:700;font-size:21pt;margin-top:1mm;line-height:1.2}
  .t-code{display:inline-block;margin-top:8mm;border:.6mm solid #1E2C6E;border-radius:3mm;padding:5mm 10mm 5mm calc(10mm + .25em);font-family:var(--head);font-weight:800;font-size:42pt;letter-spacing:.25em;line-height:1}
  .t-steps{text-align:left;margin:11mm auto 0;max-width:118mm;font-size:12pt;line-height:1.45;padding-left:7mm}
  .t-steps li + li{margin-top:2.5mm}
  .t-foot{margin-top:9mm;font-size:10.5pt;color:#5A6382}
}

/* ── Responsive ─────────────────────────── */
@media (max-width:1180px){
  .vote{grid-template-columns:1fr}
  .status{position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
  .status > h2{grid-column:1/-1}
  .res-wrap{grid-template-columns:1fr}
}
@media (max-width:900px){
  :root{--sidew:0px}
  .side{position:static;width:auto;flex-direction:column;inset:auto}
  .brand{padding:12px 16px;gap:12px}
  .brand .disc{width:52px;height:52px}
  .brand .disc img{width:36px;height:42px}
  .brand b{font-size:18px}.brand span{font-size:13px;display:inline}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;padding:0 8px 8px}
  .nav button{width:auto;white-space:nowrap;padding:9px 14px;font-size:15px;border-radius:10px;border-right:0}
  .nav button svg{width:18px;height:18px}
  .side-foot{display:none}
  .content{margin-left:0}
  .topbar{position:static;height:auto;padding:14px 16px;flex-wrap:wrap}
  .who{font-size:15px}.avatar{width:40px;height:40px;font-size:15px}
  .top-right{width:100%;justify-content:space-between;gap:12px}
  .lang button{padding:6px 11px;font-size:13px}
  main{padding:18px 14px 120px}
  .hero{padding:18px;gap:16px;min-height:0}
  .hero img{width:70px;height:80px}
  .hero .deco,.hero p{display:none}
  .hero .txt{margin-right:0}
  .hero h2{font-size:22px}
  .alert{font-size:15px;padding:12px 16px}
  .topbar h1{font-size:18px;white-space:normal}
  .codebox{gap:8px}
  .status .help,.status .confirm-card{display:none}
  .cands{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .cand{padding:14px 10px}
  .cand .ph{width:96px;height:96px}
  .cand h4{font-size:16px}
  .cand .btn{font-size:12.5px;padding:10px 6px}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--side);color:#fff;align-items:center;gap:14px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(16,26,64,.3)}
  .mbar b{font-family:var(--head);font-size:24px;display:block;line-height:1}
  .mbar span{font-size:13px;color:#C5CCEA}
  .mbar .btn{margin-left:auto}
  .row{grid-template-columns:30px 40px minmax(0,1fr) 46px;padding:8px 12px}
  .row .vb{display:none}
  .toast{left:50%;bottom:90px}
}

/* Server calls.
   Inside Apps Script the page uses google.script.run. On GitHub Pages it sends plain
   web requests to the Apps Script API with no cookies, so Google sign-in (and having
   several Google accounts on one phone) never comes into it. */
const API_URL = 'https://script.google.com/macros/s/AKfycbw5qVDcv103eQmUZA2RbbYguSberuNfuvWOO0kXiWQ7qo2YkC9EOd208HoF9QKarbatrA/exec';
const VIA_API = /^https:\/\//.test(API_URL) && !(window.google && google.script && google.script.run);
function netError(kind) { const e = new Error(kind); e.net = kind; return e; }
function run(fn, ...args) {
  if (!VIA_API) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => reject(err && err.message ? err : new Error(String(err))))[fn](...args);
    });
  }
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 45000);
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // keeps it a "simple" request (no CORS preflight)
    body: JSON.stringify({ fn, args }),
    credentials: 'omit', redirect: 'follow', cache: 'no-store', signal: ctrl.signal
  }).then(res => res.text().then(text => {
    let data;
    try { data = JSON.parse(text); } catch (e) { throw netError('server'); }
    if (!data.ok) throw new Error(data.error || 'Unknown error');
    return data.result;
  }), () => { throw netError('network'); })
    .finally(() => clearTimeout(timer));
}

  const k = SERVER_ERR[(err && err.message) || '']; return k ? t(k) : (err && err.message) || String(err);
}
function replyText(r) { return r.reason && I18N.en['err_' + r.reason] !== undefined ? t('err_' + r.reason, { max: r.max }) : r.message; }
function isPinError(err) { return (err && err.message) === 'That PIN is not correct.'; }

let toastTimer;
function toast(text, bad) {
  const el = $('#toast');
  el.textContent = text;
  el.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = 'toast' + (bad ? ' bad' : ''), 3200);
}

const ICON = {
  tick: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  bell: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22a2.5 2.5 0 0 0 2.5-2.5h-5A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5.5-6.8V3a1.5 1.5 0 0 0-3 0v1.2A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/></svg>',
  alert: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="flex:0 0 auto;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>'
};
const DECO = `<svg class="deco" viewBox="0 0 300 200" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
  <polygon points="150,0 300,0 300,200 70,200" fill="#16245C"/>
  <polygon points="118,0 134,0 54,200 38,200" fill="#F6C20F"/>
  <polygon points="190,0 300,0 300,92" fill="#2F3C9E"/>
  <polygon points="300,60 236,100 300,140" fill="#F6C20F"/>
  <polygon points="210,200 262,120 278,120 226,200" fill="#F6C20F"/>
  <polygon points="168,0 176,0 96,200 88,200" fill="#fff" opacity=".9"/>
</svg>`;

/* ═════════════════════ State ═════════════════════ */
const S = {
  boot: null, status: null,
  view: 'vote',
  step: 'start',            // start | ballot | review | done
  cands: null, byId: {}, classes: [],
  code: '', voter: null, max: 34, picks: [],
  f: { q: '', cls: 'all', g: 'all', mine: false },
  pin: null,
  results: null, showAll: false, auto: true,
  roll: null, rf: { q: '', cls: 'all', st: 'all' }, reveal: false,
  admin: null
};
try { S.pin = sessionStorage.getItem('rcl_pin') || null; } catch (e) {}

function initials(c) { return ((c.name || '')[0] || '') + ((c.surname || '')[0] || ''); }
function face(c) {
  return c && c.photo ? `<img src="${c.photo}" alt="" loading="lazy">` : `<span class="ini">${esc(initials(c || {}))}</span>`;
}
function setCandidates(list) {
  S.cands = list || [];
  S.byId = {};
  const cls = [];
  S.cands.forEach(c => { S.byId[c.id] = c; if (!cls.includes(c.cls)) cls.push(c.cls); });
  S.classes = cls;
}
const firstName = c => c.name.split(' ')[0];
const genderWord = g => g === 'Girl' ? t('girl') : g === 'Boy' ? t('boy') : '';

/* ═════════════════════ Shell ═════════════════════ */
$('#emb-side').src = EMBLEM;

function applyStatic() {
  document.documentElement.lang = LANG;
  $$('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  $('#emb-side').alt = t('emblem_alt');
  $('#brand-name').innerHTML = LANG === 'af'
    ? '<span style="margin:0 0 3px">LAERSKOOL</span><b>KATHU</b>'
    : '<b>KATHU</b><span>PRIMARY SCHOOL</span>';
  $('#nav').setAttribute('aria-label', LANG === 'af' ? 'Afdelings' : 'Sections');
  $$('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
  paintWho();
}

function setLang(lang) {
  if (lang === LANG) return;
  LANG = lang;
  try { localStorage.setItem('rcl_lang', lang); } catch (e) {}
  applyStatic();
  // Redraw the current screen in the new language without losing anything
  if (S.view === 'vote') { if (S.step === 'done') return; if (S.step === 'start') renderVote(); else if (S.step === 'ballot') renderBallot(); else renderReview(); return; }
  if (S.view === 'help') return renderHelp();
  if (!S.pin) return renderGate();
  if (S.view === 'results' && S.results) return renderResults();
  if (S.view === 'roll' && S.roll) return renderRoll();
  if (S.view === 'admin' && S.admin) return renderAdmin();
}
$$('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

function paintStatus(st) {
  if (!st) return;
  S.status = st;
  $('#ring-n').textContent = `${st.voted} / ${st.total}`;
  const pct = st.total ? st.voted / st.total : 0;
  const C = 2 * Math.PI * 19;
  $('#ring-arc').setAttribute('stroke-dasharray', `${(pct * C).toFixed(1)} ${C.toFixed(1)}`);
  paintWho();
}

function paintWho() {
  let h;
  if (S.voter && (S.step === 'ballot' || S.step === 'review')) {
    h = `<span>${t('who_voting')} <b>${esc(S.voter.first)} (${esc(S.voter.staff ? t('teacher') : S.voter.cls)})</b></span><span class="avatar">${esc((S.voter.first || '?')[0])}</span>`;
  } else if (S.pin) {
    h = `<span>${t('who_official')} <b>${t('official')}</b></span><span class="avatar">${LANG === 'af' ? 'VB' : 'EO'}</span>`;
  } else {
    const open = S.status && S.status.pollsOpen;
    h = `<span>${t('who_station')} <b>${open ? t('open_word') : t('closed_word')}</b></span><span class="avatar off"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-4 0-8 2-8 5v1h16v-1c0-3-4-5-8-5z"/></svg></span>`;
  }
  $('#who').innerHTML = h;
}

setInterval(() => {
  if (S.view === 'vote' && S.step !== 'start') return; // don't disturb a voter
  run('getStatus').then(st => {
    const changed = !S.status || st.pollsOpen !== S.status.pollsOpen;
    paintStatus(st);
    if (changed && S.view === 'vote' && S.step === 'start') renderVote();
  }).catch(() => {});
}, 30000);

$$('.nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));
$('#lockbtn').addEventListener('click', () => { lockOfficial(); toast(t('locked')); });

function lockOfficial() {
  S.pin = null; S.results = null; S.roll = null; S.admin = null;
  try { sessionStorage.removeItem('rcl_pin'); } catch (e) {}
  $('#lockbtn').hidden = true;
  paintWho();
  if (S.view !== 'vote' && S.view !== 'help') render();
}

function go(view) {
  if (S.view === 'vote' && (S.step === 'ballot' || S.step === 'review') && view !== 'vote') {
    if (!confirm(t('leave_confirm'))) return;
    resetVoter();
  }
  S.view = view;
  $$('.nav button').forEach(b => b.dataset.view === view ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  render();
  window.scrollTo(0, 0);
}

function render() {
  stopAuto();
  removeMbar();
  if (S.view === 'vote') return renderVote();
  if (S.view === 'help') return renderHelp();
  if (!S.pin) return renderGate();
  if (S.view === 'results') return loadResults();
  if (S.view === 'roll') return loadRoll();
  if (S.view === 'admin') return loadAdmin();
}

function loading(text) {
  $('#main').innerHTML = `<div class="loading"><div class="spin"></div>${esc(text || t('loading'))}</div>`;
}

/* ═════════════════════ PIN gate ═════════════════════ */
function renderGate() {
  const what = { results: t('gate_results'), roll: t('gate_roll'), admin: t('gate_admin') }[S.view];
  $('#main').innerHTML = `
    <form class="gate card" id="gate">
      <img src="${EMBLEM}" alt="">
      <h2>${t('gate_title')}</h2>
      <p>${esc(t('gate_text', { what }))}</p>
      <label class="sr" for="pin">${t('pin_label')}</label>
      <input class="field" id="pin" type="password" autocomplete="off" required>
      <div id="gate-msg"></div>
      <button class="btn" type="submit">${t('unlock')}</button>
    </form>`;
  $('#pin').focus();
  $('#gate').addEventListener('submit', e => {
    e.preventDefault();
    const pin = $('#pin').value.trim();
    const b = $('#gate button'); b.disabled = true; b.textContent = t('checking');
    run('adminUnlock', pin).then(() => {
      S.pin = pin;
      try { sessionStorage.setItem('rcl_pin', pin); } catch (e) {}
      $('#lockbtn').hidden = false;
      paintWho();
      render();
    }).catch(err => {
      b.disabled = false; b.textContent = t('unlock');
      $('#gate-msg').innerHTML = `<div class="msg bad">${ICON.alert}${esc(errText(err))}</div>`;
      $('#pin').select();
    });
  });
}
function pinFailed(err) {
  if (isPinError(err)) { lockOfficial(); renderGate(); }
  toast(errText(err), true);
}

/* ═════════════════════ HELP ═════════════════════ */
function renderHelp() {
  const max = S.status ? S.status.maxVotes : 34;
  $('#main').innerHTML = `
    <div class="card hero">${DECO}<img src="${EMBLEM}" alt=""><div class="txt"><h2>${t('help_title')}</h2><p>${t('help_sub')}</p></div></div>
    <div class="helpgrid">
      <div class="card acard"><h3>${t('help_how')}</h3><ol>
        <li>${t('help_how1')}</li>
        <li>${t('help_how2', { max })}</li>
        <li>${t('help_how3')}</li></ol></div>
      <div class="card acard"><h3>${t('help_rules')}</h3><ul>
        <li>${t('rule1')}</li><li>${t('rule2')}</li><li>${t('rule3')}</li><li>${t('rule4')}</li><li>${t('rule5')}</li></ul></div>
      <div class="card acard"><h3>${t('help_need')}</h3><ul>
        <li>${t('help_need1')}</li></ul></div>
    </div>`;
}

/* ═════════════════════ VOTE ═════════════════════ */
function resetVoter() {
  S.step = 'start'; S.code = ''; S.voter = null; S.picks = [];
  S.f = { q: '', cls: 'all', g: 'all', mine: false };
  clearIdle();
  removeMbar();
  paintWho();
}
function removeMbar() { $('.mbar') && $('.mbar').remove(); }

function voteShell(mainHtml, slim) {
  const open = S.status ? S.status.pollsOpen : true;
  $('#main').innerHTML = `
    <div class="vote">
      <div>
        <div class="card hero${slim ? ' slim' : ''}">${DECO}<img src="${EMBLEM}" alt="${t('emblem_alt')}"><div class="txt"><h2>${t('hero_title')}</h2>${slim ? '' : `<p>${t('hero_sub')}</p>`}</div></div>
        <div class="alert${open ? '' : ' closed'}">${ICON.bell}<span>${open ? `<b>${t('alert_open')}</b> &nbsp;•&nbsp; ${t('alert_open2')}` : `<b>${t('alert_closed')}</b> &nbsp;•&nbsp; ${t('alert_closed2')}`}</span></div>
        <div id="vmain">${mainHtml}</div>
      </div>
      <aside class="status" id="vstatus"></aside>
    </div>`;
  paintSide();
}

function paintSide() {
  const box = $('#vstatus'); if (!box) return;
  const order = ['start', 'ballot', 'review', 'done'];
  const at = order.indexOf(S.step);
  const step = (i, label) => {
    const cls = at > i || S.step === 'done' ? 'done' : at === i ? 'now' : '';
    return `<li class="${cls}"><span class="dot">${cls === 'done' ? ICON.tick : ''}</span><span class="lbl"><span>${t('step', { n: i + 1 })}<br>${label}</span>${cls === 'done' ? ICON.tick : ''}</span></li>`;
  };
  const st = S.status || { voted: 0, total: 0, maxVotes: 34 };
  let mid;
  if (S.step === 'ballot' || S.step === 'review') {
    let chips = S.picks.map(id => { const c = S.byId[id]; const nm = esc(c.name + ' ' + c.surname); return `<button data-rm="${esc(id)}" title="${t('remove')} ${nm}" aria-label="${t('remove')} ${nm}" ${S.step === 'review' ? 'disabled' : ''}>${face(c)}</button>`; }).join('');
    for (let k = S.picks.length; k < S.max; k++) chips += '<span class="empty-slot" aria-hidden="true"></span>';
    mid = `<div class="card"><h3>${t('your_choices')}</h3><div class="bignum">${S.picks.length}<small> / ${S.max}</small></div><div class="chosen" id="chosen">${chips}</div></div>`;
  } else {
    const pct = st.total ? Math.round(st.voted / st.total * 100) : 0;
    mid = `<div class="card"><h3>${t('votes_cast')}</h3><div class="bignum">${st.voted}<small> / ${st.total}</small></div><div class="meter"><i style="width:${pct}%"></i></div></div>`;
  }
  box.innerHTML = `
    <h2>${t('my_status')}</h2>
    <div class="card"><h3>${t('progress')}</h3><ol class="steps">${step(0, t('step1'))}${step(1, t('step2'))}${step(2, t('step3'))}</ol></div>
    ${mid}
    <div class="card help"><h3>${t('help_card')}</h3><ul><li>${t('help_card1', { max: S.voter ? S.max : st.maxVotes })}</li><li>${t('help_card2')}</li><li>${t('help_card3')}</li></ul><button class="link" id="to-help">${t('read_rules')}</button></div>
    ${S.step === 'ballot' ? `<div class="card confirm-card"><button class="btn block lg" id="confirm">${t('confirm_submit')}</button></div>` : ''}`;
  $('#to-help').addEventListener('click', () => go('help'));
  $('#confirm') && $('#confirm').addEventListener('click', toReview);
  $('#chosen') && $('#chosen').addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (b) toggle(b.dataset.rm); });
}

function renderVote() {
  if (S.step === 'ballot') return renderBallot();
  if (S.step === 'review') return renderReview();
  if (S.step === 'done') return;
  const open = S.status ? S.status.pollsOpen : true;
  voteShell(`
    <h3 class="sec-title">${t('code_title')}</h3>
    <p class="sec-sub">${t('code_sub')}</p>
    <form class="card codecard" id="codeform" autocomplete="off">
      <label for="c0">${t('code_label')}</label>
      <div class="coderow">
        <div class="codebox" id="codebox">
          ${Array.from({length: CODE_LEN}, (_, i) => `<input id="c${i}" inputmode="text" maxlength="1" aria-label="${t('code_char', { i: i + 1, n: CODE_LEN })}" ${open ? '' : 'disabled'}>`).join('')}
        </div>
        <button class="btn red lg" id="codego" type="submit" disabled>${t('open_ballot')}</button>
      </div>
      <div id="code-msg"></div>
    </form>`);
  const boxes = $$('#codebox input');
  const val = () => boxes.map(b => b.value).join('');
  const sync = () => {
    boxes.forEach(b => b.classList.toggle('filled', !!b.value));
    $('#codego').disabled = val().length !== CODE_LEN || !open;
  };
  boxes.forEach((b, i) => {
    b.addEventListener('input', () => {
      let v = b.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (v.length > 1) { fill(v, i); return; }
      b.value = v;
      if (v && i < CODE_LEN - 1) boxes[i + 1].focus();
      sync();
    });
    b.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !b.value && i > 0) { boxes[i - 1].focus(); boxes[i - 1].value = ''; sync(); e.preventDefault(); }
      if (e.key === 'ArrowLeft' && i > 0) boxes[i - 1].focus();
      if (e.key === 'ArrowRight' && i < CODE_LEN - 1) boxes[i + 1].focus();
    });
    b.addEventListener('paste', e => { e.preventDefault(); fill((e.clipboardData.getData('text') || '').toUpperCase().replace(/[^A-Z0-9]/g, ''), i); });
    b.addEventListener('focus', () => b.select());
  });
  function fill(v, from) {
    for (let k = 0; k < v.length && from + k < CODE_LEN; k++) boxes[from + k].value = v[k];
    boxes[Math.min(from + v.length, CODE_LEN - 1)].focus();
    sync();
  }
  if (open) boxes[0].focus();
  $('#codeform').addEventListener('submit', e => {
    e.preventDefault();
    const code = val();
    if (code.length !== CODE_LEN) return;
    const btn = $('#codego'); btn.disabled = true; btn.textContent = t('checking_caps');
    run('checkCode', code, !!S.cands).then(r => {
      if (!r.ok) {
        btn.disabled = false; btn.textContent = t('open_ballot');
        $('#code-msg').innerHTML = `<div class="msg bad">${ICON.alert}<span>${esc(replyText(r))}</span></div>`;
        $('#codebox').classList.remove('shake'); void $('#codebox').offsetWidth; $('#codebox').classList.add('shake');
        if (r.reason === 'closed') run('getStatus').then(paintStatus).catch(() => {});
        return;
      }
      if (S.pin) lockOfficial(); // a voter is now at this device
      if (r.candidates) setCandidates(r.candidates);
      S.code = code; S.voter = r.voter; S.max = r.maxVotes; S.picks = [];
      S.step = 'ballot';
      renderBallot();
      window.scrollTo(0, 0);
    }).catch(err => {
      btn.disabled = false; btn.textContent = t('open_ballot');
      $('#code-msg').innerHTML = `<div class="msg bad">${ICON.alert}<span>${esc(err && err.net ? errText(err) : t('err_network'))}</span></div>`;
    });
  });
}

/* ── Ballot ── */
function renderBallot() {
  const counts = {};
  S.cands.forEach(c => counts[c.cls] = (counts[c.cls] || 0) + 1);
  voteShell(`
    <h3 class="sec-title">${t('choose_title')}</h3>
    <p class="sec-sub">${esc(t('choose_sub', { name: S.voter.first, n: S.cands.length, max: S.max }))}</p>
    <div class="toolbar">
      <label class="search"><span class="sr">${t('search_name')}</span>${ICON.search}<input class="field" id="q" placeholder="${t('search_name')}" value="${esc(S.f.q)}"></label>
      <div class="chips" role="group">
        <button class="chip" data-g="all" aria-pressed="${S.f.g === 'all'}">${t('everyone')}</button>
        <button class="chip" data-g="Girl" aria-pressed="${S.f.g === 'Girl'}">${t('girls')}</button>
        <button class="chip" data-g="Boy" aria-pressed="${S.f.g === 'Boy'}">${t('boys')}</button>
        <button class="chip" data-mine="1" aria-pressed="${S.f.mine}">${t('my_choices')}</button>
      </div>
      <button class="btn ghost sm" id="cancel" style="margin-left:auto">${t('cancel_ballot')}</button>
    </div>
    <div class="chips" role="group" style="margin-top:8px">
      <button class="chip" data-cls="all" aria-pressed="${S.f.cls === 'all'}">${t('all_classes')}</button>
      ${S.classes.map(c => `<button class="chip" data-cls="${esc(c)}" aria-pressed="${S.f.cls === c}">${esc(c)}<span class="n">${counts[c]}</span></button>`).join('')}
    </div>
    <div id="cands"></div>`, true);
  paintGrid();
  buildMbar();
  $('#q').addEventListener('input', e => { S.f.q = e.target.value; paintGrid(); });
  $$('[data-cls]').forEach(b => b.addEventListener('click', () => { S.f.cls = b.dataset.cls; S.f.mine = false; syncChips(); paintGrid(); }));
  $$('[data-g]').forEach(b => b.addEventListener('click', () => { S.f.g = b.dataset.g; S.f.mine = false; syncChips(); paintGrid(); }));
  $('[data-mine]').addEventListener('click', () => { S.f.mine = !S.f.mine; syncChips(); paintGrid(); });
  $('#cancel').addEventListener('click', () => {
    if (S.picks.length && !confirm(t('cancel_confirm'))) return;
    resetVoter(); renderVote();
  });
  $('#cands').addEventListener('click', e => {
    const b = e.target.closest('[data-pick]');
    if (b) toggle(b.dataset.pick);
  });
  paintWho();
  armIdle();
}

function syncChips() {
  $$('[data-cls]').forEach(b => b.setAttribute('aria-pressed', String(!S.f.mine && S.f.cls === b.dataset.cls)));
  $$('[data-g]').forEach(b => b.setAttribute('aria-pressed', String(!S.f.mine && S.f.g === b.dataset.g)));
  $('[data-mine]').setAttribute('aria-pressed', String(S.f.mine));
}

function fold(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function matches(c) {
  if (S.f.mine) return S.picks.includes(c.id);
  if (S.f.cls !== 'all' && c.cls !== S.f.cls) return false;
  if (S.f.g !== 'all' && c.gender !== S.f.g) return false;
  const q = fold(S.f.q.trim());
  if (q && !fold(c.name + ' ' + c.surname).includes(q)) return false;
  return true;
}

function pickLabel(c, on) { return on ? t('chosen_caps') : t('vote_for_caps', { name: firstName(c).toUpperCase() }); }
function cardHtml(c, interactive) {
  const on = S.picks.includes(c.id);
  const btn = interactive
    ? `<button class="btn red" data-pick="${esc(c.id)}" aria-pressed="${on}" aria-label="${on ? t('remove') : t('vote_for')} ${esc(c.name + ' ' + c.surname)}">${esc(pickLabel(c, on))}</button>`
    : '';
  return `<div class="cand${on ? ' on' : ''}" data-id="${esc(c.id)}">
      <span class="tick">${ICON.tick}</span>
      <span class="ph">${face(c)}</span>
      <h4>${esc(c.name)} ${esc(c.surname)}</h4>
      <div class="cl">${esc(t('class_x', { c: c.cls }))}</div>
      ${btn}
    </div>`;
}

function paintGrid() {
  const list = S.cands.filter(matches);
  const box = $('#cands');
  if (!list.length) {
    box.innerHTML = `<div class="empty">${S.f.mine ? t('none_chosen') : t('no_match')}</div>`;
    return;
  }
  const grouped = S.f.cls === 'all' && !S.f.mine && !S.f.q.trim();
  if (!grouped) {
    box.innerHTML = `<div class="cands" style="margin-top:18px">${list.map(c => cardHtml(c, true)).join('')}</div>`;
  } else {
    box.innerHTML = S.classes.map(cl => {
      const g = list.filter(c => c.cls === cl);
      if (!g.length) return '';
      return `<div class="group-h"><h4>${esc(t('class_x', { c: cl }))}</h4><span>${t('n_cands', { n: g.length })}</span></div><div class="cands">${g.map(c => cardHtml(c, true)).join('')}</div>`;
    }).join('');
  }
  markFull();
}

function markFull() {
  const full = S.picks.length >= S.max;
  $$('#cands .cand').forEach(el => el.classList.toggle('full', full));
}

function toggle(id) {
  armIdle();
  const i = S.picks.indexOf(id);
  if (i >= 0) S.picks.splice(i, 1);
  else {
    if (S.picks.length >= S.max) { toast(t('full_toast', { max: S.max }), true); return; }
    S.picks.push(id);
  }
  const on = S.picks.includes(id);
  const c = S.byId[id];
  $$(`.cand[data-id="${CSS.escape(id)}"]`).forEach(el => {
    el.classList.toggle('on', on);
    const b = $('[data-pick]', el);
    if (b) { b.textContent = pickLabel(c, on); b.setAttribute('aria-pressed', String(on)); b.setAttribute('aria-label', (on ? t('remove') : t('vote_for')) + ' ' + c.name + ' ' + c.surname); }
  });
  markFull();
  paintSide();
  paintMbar();
  if (S.f.mine && !on) paintGrid();
}

function buildMbar() {
  removeMbar();
  const m = document.createElement('div');
  m.className = 'mbar';
  m.innerHTML = `<div><b id="mb-n">0 / ${S.max}</b><span>${t('chosen_word')}</span></div><button class="btn gold" id="mb-go">${t('confirm_ballot')}</button>`;
  document.body.appendChild(m);
  $('#mb-go').addEventListener('click', toReview);
  paintMbar();
}
function paintMbar() {
  if (!$('#mb-n')) return;
  $('#mb-n').textContent = `${S.picks.length} / ${S.max}`;
}

function toReview() {
  S.step = 'review'; renderReview(); window.scrollTo(0, 0);
}

/* ── Review ── */
function castLabel() { return S.picks.length ? t('cast_caps') : t('cast_empty_caps'); }
function renderReview() {
  removeMbar();
  $('#toast').className = 'toast';
  const n = S.picks.length;
  voteShell(`
    <h3 class="sec-title">${t('review_title')}</h3>
    <p class="sec-sub">${n ? t('review_chose', { n }) : t('review_none')} ${t('review_final')}</p>
    ${n === 0 ? `<div class="note">${t('review_empty')}</div>`
      : n < S.max ? `<div class="note">${t('review_more', { n: S.max - n })}</div>` : ''}
    ${n ? `<div class="cands small">${S.picks.map(id => cardHtml(S.byId[id], false)).join('')}</div>` : ''}
    <div id="rev-msg"></div>
    <div class="actions">
      <button class="btn ghost lg" id="back">${t('change_choices')}</button>
      <button class="btn red lg" id="cast">${castLabel()}</button>
    </div>`, true);
  $('#back').addEventListener('click', () => { S.step = 'ballot'; renderBallot(); });
  $('#cast').addEventListener('click', cast);
  paintWho();
  armIdle();
}

function cast() {
  const btn = $('#cast'); btn.disabled = true; btn.textContent = t('casting_caps');
  $('#back').disabled = true;
  const reset = msg => {
    btn.disabled = false; btn.textContent = castLabel(); $('#back').disabled = false;
    $('#rev-msg').innerHTML = `<div class="msg bad">${ICON.alert}<span>${esc(msg)}</span></div>`;
  };
  run('submitBallot', S.code, S.picks.slice()).then(r => {
    if (!r.ok) return reset(replyText(r));
    showDone();
  }).catch(() => reset(t('err_dropped')));
}

let doneTimer;
function showDone() {
  const first = S.voter.first;
  clearIdle();
  $('#toast').className = 'toast';
  S.step = 'done';
  window.scrollTo(0, 0);
  voteShell(`
    <div class="card thanks">
      <div class="box" aria-hidden="true"><div class="paper"></div><div class="slotline"></div><div class="front"><span class="tickmark">${ICON.tick}</span></div></div>
      <h2>${t('done_title')}</h2>
      <p>${esc(t('done_text', { name: first }))}</p>
      <div class="actions" style="justify-content:center"><button class="btn lg" id="next">${t('next_voter')}</button></div>
      <p class="small-note" id="cd"></p>
    </div>`, true);
  paintWho();
  let left = 8;
  const tick = () => { const el = $('#cd'); if (el) el.textContent = t('resets_in', { s: left }); };
  tick();
  clearInterval(doneTimer);
  doneTimer = setInterval(() => { left--; tick(); if (left <= 0) finish(); }, 1000);
  function finish() { clearInterval(doneTimer); resetVoter(); run('getStatus').then(paintStatus).catch(() => {}); if (S.view === 'vote') renderVote(); }
  $('#next').addEventListener('click', finish);
  $('#next').focus();
}

/* ── Idle guard: an abandoned ballot closes itself ── */
let idleTimer;
function armIdle() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (S.view === 'vote' && (S.step === 'ballot' || S.step === 'review')) {
      resetVoter(); renderVote();
      $('#code-msg').innerHTML = `<div class="msg info">${ICON.alert}<span>${t('idle_msg')}</span></div>`;
    }
  }, IDLE_LIMIT_MS);
}
function clearIdle() { clearTimeout(idleTimer); }
['pointerdown', 'keydown', 'scroll'].forEach(ev => document.addEventListener(ev, () => { if (S.step === 'ballot' || S.step === 'review') armIdle(); }, { passive: true }));

/* ═════════════════════ RESULTS ═════════════════════ */
let autoTimer;
function stopAuto() { clearInterval(autoTimer); autoTimer = null; }

function loadResults(silent) {
  if (!silent) loading(t('loading_count'));
  run('getResults', S.pin, !S.cands).then(r => {
    if (r.candidates) setCandidates(r.candidates);
    S.results = r;
    paintStatus(r.status);
    if (S.view === 'results') renderResults();
  }).catch(pinFailed);
}

function ranked() {
  const r = S.results;
  const rows = S.cands.map(c => ({ c, t: r.tally[c.id] || { total: 0, learner: 0, staff: 0 } }));
  rows.sort((a, b) => b.t.total - a.t.total || a.c.surname.localeCompare(b.c.surname) || a.c.name.localeCompare(b.c.name));
  let prev = null, rank = 0;
  rows.forEach((x, i) => { if (x.t.total !== prev) { rank = i + 1; prev = x.t.total; } x.rank = rank; });
  return rows;
}

function renderResults() {
  const r = S.results, st = r.status, max = st.seats || st.maxVotes;
  const rows = ranked();
  const top = rows.slice(0, max);
  const best = Math.max(1, rows[0] ? rows[0].t.total : 1);
  const tie = rows.length > max && rows[max - 1].t.total === rows[max].t.total && rows[max].t.total > 0;
  const tied = tie ? rows.filter(x => x.t.total === rows[max - 1].t.total) : [];
  const girls = top.filter(x => x.c.gender === 'Girl').length, boys = top.filter(x => x.c.gender === 'Boy').length;
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const shown = S.showAll ? rows : rows.slice(0, Math.max(max + 6, 40));
  let list = '';
  shown.forEach((x, i) => {
    const g = genderWord(x.c.gender);
    list += `<div class="row${i < max ? ' lead' : ''}">
      <span class="rk">${x.rank}</span>
      <span class="pic">${face(x.c)}</span>
      <span class="who2"><b>${esc(x.c.name)} ${esc(x.c.surname)}</b><span>${esc(t('class_x', { c: x.c.cls }))}${g ? ', ' + g : ''}</span></span>
      <span class="vb" title="${t('vote_split', { l: x.t.learner, t: x.t.staff })}"><i style="width:${x.t.learner / best * 100}%"></i><i class="s" style="width:${x.t.staff / best * 100}%"></i></span>
      <span class="vt">${x.t.total}</span>
    </div>`;
    if (i === max - 1 && rows.length > max) list += `<div class="cut">${t('cutoff', { max })}</div>`;
  });
  const time = new Date(r.at).toLocaleTimeString(LANG === 'af' ? 'af-ZA' : 'en-ZA', {hour: '2-digit', minute: '2-digit', second: '2-digit'});
  $('#main').innerHTML = `
    <div class="sec-h">
      <div><h2>${t('res_title')}</h2><p class="small-note">${t('counted_at', { time })}${S.auto ? t('refreshing') : ''}</p></div>
      <div class="inline">
        <button class="btn ghost sm" id="auto">${S.auto ? t('pause_refresh') : t('auto_refresh')}</button>
        <button class="btn sm" id="refresh">${t('count_again')}</button>
        <button class="btn gold sm" id="export">${t('save_results')}</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat card"><div class="k">${t('ballots_cast')}</div><div class="v">${r.ballots}</div><div class="small-note">${t('choices_total', { n: r.picksCast, e: r.blankBallots || 0 })}</div></div>
      <div class="stat card"><div class="k">${t('learners_voted')}</div><div class="v">${st.learnersVoted} <small>${t('of')} ${st.learners}</small></div><div class="meter"><i style="width:${pct(st.learnersVoted, st.learners)}%"></i></div></div>
      <div class="stat card gold"><div class="k">${t('teachers_voted')}</div><div class="v">${st.staffVoted} <small>${t('of')} ${st.staff}</small></div><div class="meter"><i style="width:${pct(st.staffVoted, st.staff)}%"></i></div></div>
      <div class="stat card"><div class="k">${t('turnout_all')}</div><div class="v">${pct(st.voted, st.total)}%</div><div class="meter"><i style="width:${pct(st.voted, st.total)}%"></i></div></div>
    </div>
    <div class="res-wrap">
      <div class="card board">
        <div class="legend"><span><i></i>${t('legend_l')}</span><span><i class="s"></i>${t('legend_t')}</span></div>
        ${tie ? `<div class="warn">${t('tie_warn', { n: tied.length, v: rows[max - 1].t.total, max })}</div>` : ''}
        ${r.ballots ? list : `<div class="empty">${t('no_ballots')}</div>`}
        ${r.ballots && rows.length > shown.length ? `<button class="btn ghost sm more" id="all">${t('show_all', { n: rows.length })}</button>` : ''}
        ${r.ballots && S.showAll ? `<button class="btn ghost sm more" id="less">${t('show_fewer')}</button>` : ''}
      </div>
      <div>
        <div class="card sidecard">
          <h3>${t('mix_title', { max })}</h3>
          <div class="mix"><i style="width:${pct(girls, top.length)}%;background:var(--navy)"></i><i style="width:${pct(boys, top.length)}%;background:var(--gold)"></i></div>
          <div class="muted" style="font-size:15px">${t('mix_text', { g: girls, b: boys })}</div>
        </div>
        <div class="card sidecard">
          <h3>${t('turnout_class')}</h3>
          ${r.classes.map(c => `<div class="crow"><span>${c.cls === 'Staff' ? t('teachers') : esc(c.cls)}</span><span class="meter"><i style="width:${pct(c.voted, c.total)}%"></i></span><span>${c.voted}/${c.total}</span></div>`).join('')}
        </div>
      </div>
    </div>`;
  $('#refresh').addEventListener('click', () => loadResults(true));
  $('#auto').addEventListener('click', () => { S.auto = !S.auto; renderResults(); });
  $('#export').addEventListener('click', e => {
    const b = e.currentTarget; b.disabled = true; b.textContent = t('saving');
    run('exportResults', S.pin).then(x => {
      b.disabled = false; b.textContent = t('save_results');
      toast(t('results_saved'));
      window.open(x.url, '_blank');
    }).catch(err => { b.disabled = false; b.textContent = t('save_results'); pinFailed(err); });
  });
  $('#all') && $('#all').addEventListener('click', () => { S.showAll = true; renderResults(); });
  $('#less') && $('#less').addEventListener('click', () => { S.showAll = false; renderResults(); });
  stopAuto();
  if (S.auto) autoTimer = setInterval(() => { if (S.view === 'results' && S.pin) loadResults(true); else stopAuto(); }, 20000);
}

/* ═════════════════════ VOTER ROLL ═════════════════════ */
function loadRoll() {
  loading(t('loading_roll'));
  run('getRoll', S.pin).then(r => { S.roll = r; paintStatus(r.status); if (S.view === 'roll') renderRoll(); }).catch(pinFailed);
}

function rollRows() {
  const q = S.rf.q.trim().toLowerCase();
  return S.roll.people.filter(p => {
    if (S.rf.cls !== 'all' && p.cls !== S.rf.cls) return false;
    if (S.rf.st === 'voted' && !p.voted) return false;
    if (S.rf.st === 'not' && p.voted) return false;
    if (q && !(p.name + ' ' + p.surname + ' ' + p.id + ' ' + p.code).toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderRoll() {
  const people = S.roll.people;
  const classes = [];
  people.forEach(p => { if (!classes.includes(p.cls)) classes.push(p.cls); });
  $('#main').innerHTML = `
    <div class="sec-h">
      <div><h2>${esc(t('roll_title'))}</h2><p>${t('roll_sub', { l: people.filter(p => !p.staff).length, t: people.filter(p => p.staff).length })}</p></div>
      <div class="inline">
        <button class="btn ghost sm" id="reveal">${S.reveal ? t('hide_codes') : t('show_codes')}</button>

    </div>
    <div class="rollbar">
      <label class="search"><span class="sr">${t('roll_search')}</span>${ICON.search}<input class="field" id="rq" placeholder="${t('roll_search')}" value="${esc(S.rf.q)}"></label>
      <label class="sr" for="rc">${t('class_word')}</label>
      <select class="field" id="rc"><option value="all">${t('all_and_teachers')}</option>${classes.map(c => `<option ${S.rf.cls === c ? 'selected' : ''} value="${esc(c)}">${c === 'Staff' ? t('teachers') : esc(t('class_x', { c }))}</option>`).join('')}</select>
      <label class="sr" for="rs">${t('status_word')}</label>
      <select class="field" id="rs">
        <option value="all" ${S.rf.st === 'all' ? 'selected' : ''}>${t('everyone')}</option>
        <option value="not" ${S.rf.st === 'not' ? 'selected' : ''}>${t('not_voted')}</option>
        <option value="voted" ${S.rf.st === 'voted' ? 'selected' : ''}>${t('voted')}</option>
      </select>
      <span class="muted" id="rcount"></span>
    </div>
    <div class="card tablewrap"><table class="roll"><thead><tr><th>${t('th_id')}</th><th>${t('th_name')}</th><th>${t('th_class')}</th><th>${t('th_code')}</th><th>${t('th_status')}</th><th></th></tr></thead><tbody id="rbody"></tbody></table></div>`;
  paintRoll();
  $('#rq').addEventListener('input', e => { S.rf.q = e.target.value; paintRoll(); });
  $('#rc').addEventListener('change', e => { S.rf.cls = e.target.value; paintRoll(); });
  $('#rs').addEventListener('change', e => { S.rf.st = e.target.value; paintRoll(); });
  $('#reveal').addEventListener('click', () => { S.reveal = !S.reveal; renderRoll(); });
  $('#print').addEventListener('click', () => printSlips(rollRows()));
  $('#rbody').addEventListener('click', e => {
    const b = e.target.closest('[data-new]');
    if (!b) return;
    const p = people.find(x => x.id === b.dataset.new);
    if (!confirm(t('new_code_confirm', { name: p.name + ' ' + p.surname, code: p.code }))) return;
    b.disabled = true; b.textContent = t('working');
    run('regenerateCodes', S.pin, p.id).then(() => { toast(t('new_code_done', { name: p.name })); S.reveal = true; loadRoll(); }).catch(pinFailed);
  });
}

function paintRoll() {
  const rows = rollRows();
  $('#rcount').textContent = t('n_shown', { n: rows.length });
  $('#rbody').innerHTML = rows.map(p => `<tr>
      <td class="muted">${esc(p.id)}</td>
      <td><b>${esc(p.name)} ${esc(p.surname)}</b></td>
      <td>${p.staff ? `<span class="tag staff">${t('teacher')}</span>` : esc(p.cls)}</td>
      <td><span class="code${S.reveal ? '' : ' blur'}">${esc(p.code)}</span></td>
      <td>${p.voted ? `<span class="tag yes">${t('voted')}</span>` : `<span class="tag no">${t('not_yet')}</span>`}</td>
      <td>${p.voted ? '' : `<button class="linkbtn" data-new="${esc(p.id)}">${t('new_code')}</button>`}</td>
    </tr>`).join('') || `<tr><td colspan="6" class="empty">${t('nobody_matches')}</td></tr>`;
}

/* Learners: 21 slips per A4 page, one class per page.
   Teachers: one full page each. Printed in the language that is currently selected. */
function printSlips(rows) {
  if (!rows.length) { toast(t('nothing_to_print'), true); return; }
  const learners = rows.filter(p => !p.staff), teachers = rows.filter(p => p.staff);
  const groups = [];
  learners.forEach(p => {
    let g = groups.find(x => x.key === p.cls);
    if (!g) groups.push(g = { key: p.cls, people: [] });
    g.people.push(p);
  });
  const slip = p => {
    const name = `${p.name} ${p.surname}`.trim();
    const size = name.length > 30 ? ' xlong' : name.length > 23 ? ' long' : '';
    return `<div class="ps">
      <div class="ps-top"><img src="${EMBLEM}" alt=""><div class="org"><b>${t('school_upper')}</b><span>${t('election_name')}</span></div><span class="cls">${esc(p.cls)}</span></div>
      <div class="ps-name${size}">${esc(name)}</div>
      <div class="ps-code">${esc(p.code)}</div>
      <div class="ps-foot">${t('slip_foot')}</div>
    </div>`;
  };
  const max = S.status ? S.status.maxVotes : 34;
  const teacherPage = p => `<section class="tpage"><div class="tcard">
      <img src="${EMBLEM}" alt="">
      <div class="t-school">${t('school_upper')}</div>
      <div class="t-title">${t('election_name')}</div>
      <div class="t-label">${t('tp_for')}</div>
      <div class="t-name">${esc(p.name)} ${esc(p.surname)}</div>
      <div class="t-code">${esc(p.code)}</div>
      <ol class="t-steps"><li>${t('tp_step1')}</li><li>${t('tp_step2')}</li><li>${t('tp_step3', { max })}</li></ol>
      <div class="t-foot">${t('tp_foot')}</div>
    </div></section>`;
  $('#print-area').innerHTML =
    groups.map(g => `<section class="sheet"><div class="slips">${g.people.map(slip).join('')}</div></section>`).join('') +
    teachers.map(teacherPage).join('');
  setTimeout(() => window.print(), 300);
}

    run('setMaxVotes', S.pin, $('#mx').value).then(s => { paintStatus(s); toast(t('max_saved', { n: s.maxVotes })); loadAdmin(); }).catch(pinFailed);
  });
  $('#seatsave').addEventListener('click', () => {
    run('setSeats', S.pin, $('#seats').value).then(s => { paintStatus(s); toast(t('top_saved', { n: s.seats })); loadAdmin(); }).catch(pinFailed);
  });
  let pack = null;
  $('#ppack').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const j = JSON.parse(rd.result);
        const photos = j.photos || j;
        pack = Object.keys(photos).filter(id => /^[LT]\d+$/.test(id) && String(photos[id]).indexOf('data:image/') === 0).map(id => ({ id, data: photos[id] }));
        if (!pack.length) throw new Error('empty');
        $('#pinfo').textContent = t('pack_ready', { f: f.name, n: pack.length });
        $('#pup').hidden = false;
      } catch (err) {
        pack = null; $('#pup').hidden = true;
        $('#pinfo').textContent = t('pack_bad');
      }
    };
    rd.readAsText(f);
  });
  $('#pup').addEventListener('click', async e => {
    if (!pack) return;
    const b = e.currentTarget; b.disabled = true; $('#pbar').hidden = false;
    let done = 0, saved = 0, skipped = [];
    try {
      for (let i = 0; i < pack.length; i += 8) {
        const r = await run('savePhotos', S.pin, pack.slice(i, i + 8));
        saved += r.saved; skipped = skipped.concat(r.skipped || []);
        done = Math.min(pack.length, i + 8);
        $('#pbar i').style.width = Math.round(done / pack.length * 100) + '%';
        b.textContent = t('uploading', { d: done, n: pack.length });
      }
      S.cands = null; // reload candidates with the new photos next time
      $('#pinfo').textContent = t('photos_saved', { n: saved }) + (skipped.length ? t('photos_skipped', { n: skipped.length, list: skipped.slice(0, 6).join(', ') + (skipped.length > 6 ? '…' : '') }) : '');
      b.textContent = t('upload_photos'); b.hidden = true; pack = null;
      toast(t('photos_toast', { n: saved }));
    } catch (err) {
      b.disabled = false; b.textContent = t('upload_photos');
      $('#pinfo').textContent = t('upload_stopped', { d: done, err: errText(err) });
      if (isPinError(err)) pinFailed(err);
    }
  });
  $('#regen').addEventListener('click', e => {
    if (!confirm(t('regen_confirm'))) return;
    const b = e.currentTarget; b.disabled = true; b.textContent = t('regen_busy');
    run('regenerateCodes', S.pin, null).then(r => { toast(t('regen_done', { n: r.changed })); loadAdmin(); }).catch(pinFailed);
  });
  $('#reset').addEventListener('click', e => {
    const word = $('#rst').value;
    if (word.trim().toUpperCase() !== 'RESET') { toast(t('reset_need'), true); return; }
    if (!confirm(t('reset_confirm'))) return;
    const b = e.currentTarget; b.disabled = true; b.textContent = t('deleting');
    run('resetElection', S.pin, word).then(() => { toast(t('reset_done')); loadAdmin(); }).catch(pinFailed);
  });
}

/* ═════════════════════ Start ═════════════════════ */
applyStatic();
loading(t('loading_election'));
run('getBootstrap').catch(err => err && err.net ? new Promise(r => setTimeout(r, 1500)).then(() => run('getBootstrap')) : Promise.reject(err)).then(b => {
  S.boot = b;
  paintStatus(b.status);
  if (S.pin) $('#lockbtn').hidden = false;
  render();
}).catch(err => {
  $('#main').innerHTML = `<div class="gate card"><h2>${t('load_failed')}</h2><p>${esc(errText(err))}</p><button class="btn" onclick="location.reload()">${t('try_again')}</button></div>`;
});
</script>
</body>
</html>
